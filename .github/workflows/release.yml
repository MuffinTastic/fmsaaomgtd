name: Mod release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew build --no-daemon

      - name: Package jar
        shell: bash
        run: |
          set -euxo pipefail
          jar=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | sort)
          count=$(echo "$jar" | sed '/^$/d' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one mod jar in build/libs, found $count:"
            echo "$jar"
            exit 1
          fi
          echo "Packaging: $jar"
          mkdir -p dist
          cp "$jar" "dist/$(basename "$jar")"

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
